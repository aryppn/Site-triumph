<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="formulario.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
    <section id="formulario">
        
        <h2>Faça sua compra</h2>
        <p>Preencha os campos abaixo para realizar sua compra</p>

        <form>
            <div class="campo formulario">
                <label for="nome" >Seu nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
            </div>

            <div class="campo formulario">
                <label for="idade" >Sua idade</label>
                <input type="text" id="idade" name="idade" placeholder="Digite sua idade">
            </div>

             <div class="campo formulario">
                <label for="email" >Seu email</label>
                <input type="text" id="email" name="email" placeholder="Digite seu email">
            </div>

            <p>Qual moto você deseja comprar</p>
            <div class="campo formulario">
                <label for="Motos" >Motos em destaque</label>
                <select name="Motos" id="Motos" required>
                    <option value="">Qual moto você deseja</option>
                    <option value="TS800">Tiger Sport 800</option>
                </select>
            </div>


            <button type="submit">Enviar formulario</button>

        </form>

    </section>

</body>
</html>
